<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>VidGrab Settings</title>
  <link rel="stylesheet" href="../shared/theme.css">
  <link rel="stylesheet" href="options.css">
  <script type="module" src="options.js"></script>
</head>
<body>
  <main class="page">
    <header class="page-head">
      <img src="../icons/icon48.png" alt="" width="40" height="40">
      <div>
        <h1>VidGrab settings</h1>
      </div>
    </header>

    <section class="card">
      <h2>Downloads</h2>
      <label class="row stacked">
        <span class="label">Save to folder</span>
        <input type="text" id="downloadDir" placeholder="Downloads" spellcheck="false">
      </label>
      <label class="row">
        <span>
          <span class="label">Show download button on videos</span>
        </span>
        <input type="checkbox" id="showOverlayButton" class="switch">
      </label>
    </section>

    <section class="card">
      <h2>Logged-in content</h2>
      <label class="row">
        <span>
          <span class="label">Use my browser login</span>
          <span class="hint">For private and login-only videos.</span>
        </span>
        <input type="checkbox" id="useCookies" class="switch">
      </label>
      <label class="row">
        <span>
          <span class="label">Also use my login for YouTube</span>
          <span class="hint">Only for age-restricted videos. May sign you out of YouTube.</span>
        </span>
        <input type="checkbox" id="useCookiesForYouTube" class="switch">
      </label>
    </section>

    <section class="card">
      <h2>Updates</h2>
      <div class="row">
        <span>
          <span class="label" id="version-line">VidGrab</span>
          <span class="hint" id="version-detail" aria-live="polite"></span>
        </span>
        <button class="btn secondary" id="check-update-btn" type="button">Check for updates</button>
      </div>
      <label class="row">
        <span>
          <span class="label">Check automatically</span>

        </span>
        <select id="updateCheckDays">
          <option value="1">Every day</option>
          <option value="7">Every 7 days</option>
          <option value="15">Every 15 days</option>
          <option value="30">Every 30 days</option>
          <option value="0">Never (manual)</option>
        </select>
      </label>
    </section>

    <section class="card">
      <h2>Helper</h2>
      <div class="row">
        <span>
          <span class="label" id="helper-line">Checking…</span>
          <span class="hint" id="helper-detail"></span>
        </span>
        <button class="btn secondary" id="update-btn" type="button">Update yt-dlp</button>
      </div>
    </section>

    <p class="saved muted" id="saved" aria-live="polite"></p>
  </main>
</body>
</html>
